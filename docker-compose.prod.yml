services:
  postgres:
    image: postgres:15
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: clean_text_db
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/src/config/init.sql:/docker-entrypoint-initdb.d/init.sql
    restart: always

  redis:
    image: redis:alpine
    restart: always

  backend:
    image: ${DOCKER_USERNAME}/clean-text-backend:latest
    environment:
      NODE_ENV: production
      PORT: 5000
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: postgres
      DB_PASSWORD: ${DB_PASSWORD}
      DB_NAME: clean_text_db
      REDIS_HOST: redis
      REDIS_PORT: 6379
      JWT_SECRET: ${JWT_SECRET}
      ACCESS_TOKEN_EXPIRES: 15m
      REFRESH_TOKEN_EXPIRES: 7d
    ports:
      - "5000:5000"
    restart: always
    depends_on:
      - postgres
      - redis

  frontend:
    image: ${DOCKER_USERNAME}/clean-text-frontend:latest
    ports:
      - "80:80"
    restart: always

volumes:
  postgres_data:
